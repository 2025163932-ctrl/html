<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html">Return to Home</a>
      <a href="notgate.html">NOT gate</a>
      <a href="andgate.html">AND Gate</a>
      <a href="binarytohex.html">Binary to hexidecimal</a>
      <a href="ascii.html">ASCLL Converter</a>
      <a href="unicode.html">UNICODE</a>
      <a href="MLinstructions.html">MLI Converter</a>
    </div>
  </nav>

  <!-- Header -->
  <header>
    <h1>Unicode Converter</h1>
  </header>

  <!-- Main Content -->
  <main class="container" style="text-align: center;">
    <p>Enter a Unicode number (e.g., <b>1F600</b> for 😀):</p>

    <input id="numb" type="text" placeholder="e.g. 1F600" style="padding: 0.5rem; width: 200px; border-radius: 5px; border: 1px solid #ccc;">
    <button type="button" class="btn" onclick="myFunction()">Submit</button>

    <br><br>

    <table style="border: 1px solid black; margin: 0 auto; border-collapse: collapse; width: 50%;">
      <tr>
        <th style="padding: 10px; background: #f8f8f8;">
          <p id="demo" style="font-size: 3rem; text-align: center;"></p>
        </th>
      </tr>
    </table>

    <section class="images">
      <img src="uni1.jpg" alt="Unicode Example 1" width="700" height="400">
      <img src="uni3.jpg" alt="Unicode Example 2" width="700" height="400">
      <img src="uni4.jpg" alt="Unicode Example 3" width="700" height="400">
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Modern HTML Project</p>
  </footer>

  <!-- Script -->
  <script>
    function myFunction() {
      const x = document.getElementById("numb").value.trim();
      if (x === "") {
        document.getElementById("demo").innerHTML = "⚠️ Please enter a Unicode number.";
        return;
      }
      const unicodeChar = String.fromCodePoint(parseInt(x, 16));
      document.getElementById("demo").innerHTML = unicodeChar;
    }
  </script>
</body>
</html>
